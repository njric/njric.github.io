<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grenouille · Renderer</title>
<meta http-equiv="refresh" content="0; url=./grenouille/">
<link rel="canonical" href="https://njric.github.io/grenouille/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Public+Sans:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root{
    --pierre:#16191c;
    --calcaire:#ece5d6;
    --calcaire-dim:#b9b1a0;
    --eau:#6e9287;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 70% 10%, #21262b 0%, var(--pierre) 55%);
    color:var(--calcaire);
    font-family:'Public Sans', -apple-system, 'Segoe UI', sans-serif;
    font-weight:300;
    display:flex; align-items:center; justify-content:center;
    padding:2rem;
  }
  main{max-width:30rem}
  .eyebrow{
    font-size:.68rem; letter-spacing:.28em; text-transform:uppercase;
    color:var(--eau); font-weight:500; margin-bottom:1.1rem;
  }
  h1{
    font-family:'Cormorant Garamond', Georgia, serif; font-weight:500;
    font-size:2.1rem; line-height:1.15; margin-bottom:.9rem;
  }
  p{font-size:.88rem; line-height:1.7; color:var(--calcaire-dim)}
  code{font-family:ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--calcaire)}
  a{
    display:inline-block; margin-top:1.6rem;
    font-size:.78rem; letter-spacing:.08em; color:var(--calcaire);
    text-decoration:none;
    border:1px solid rgba(236,229,214,.3); border-radius:2rem;
    padding:.6rem 1.3rem;
    transition:border-color .2s, color .2s;
  }
  a:hover,a:focus-visible{border-color:var(--eau); color:var(--eau); outline:none}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Prototypes</p>
  <h1>Grenouille · Renderer</h1>
  <p>La démonstration vit désormais sous <code>/grenouille/</code>. Redirection en cours&nbsp;; si rien ne se passe, suis le lien.</p>
  <a href="./grenouille/">Ouvrir la démonstration →</a>
</main>
<script>
  /* replace() plutôt que assign() : la redirection ne laisse pas d'entrée dans
     l'historique, le bouton Retour ramène donc à la page précédente, pas ici. */
  location.replace('./grenouille/');
</script>
</body>
</html>
